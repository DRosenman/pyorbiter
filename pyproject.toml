[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyorbiter"
version = "0.1.0"
description = "A tidy N-body physics engine for building and visualizing orbital simulations. The Python port of the orbitr R package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dave Rosenman" }]
requires-python = ">=3.10"
keywords = ["orbital mechanics", "n-body", "physics", "simulation", "astronomy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Interactive 3D plots and animations
plotly = ["plotly>=5.0"]
# Saving 2D animations as GIFs
gif = ["pillow>=9.0"]
# The Shiny simulator in app/
app = ["shiny>=1.0"]
dev = ["pytest>=7.0", "plotly>=5.0", "pillow>=9.0"]

[project.urls]
Homepage = "https://orbit-r.com/"
"R package" = "https://github.com/DRosenman/orbitr"

[tool.hatch.build.targets.wheel]
packages = ["src/pyorbiter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
